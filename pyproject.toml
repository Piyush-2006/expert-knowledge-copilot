[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "industrial-knowledge-copilot"
version = "0.1.0"
description = "Expert Knowledge Copilot for industrial document retrieval"
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
ingest-pdf = "src.cli.ingest_pdf:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "backend*", "frontend*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
